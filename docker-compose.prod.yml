# SYMBA T4.6 — production compose.
#
# Single service that bundles frontend (static) + backend (FastAPI) per
# the multi-stage Dockerfile.prod. The SQLite DB lives in a named
# volume so the data survives container rebuilds.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Behind a public reverse proxy (Caddy / Traefik / nginx), terminate TLS
# at the proxy and forward to symba:8088 over the internal network.

services:
  symba:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: symba-t46:prod
    container_name: symba-t46
    restart: unless-stopped
    ports:
      # SYMBA_BIND=127.0.0.1 keeps the app off the network when a reverse proxy fronts it.
      - "${SYMBA_BIND:-0.0.0.0}:${SYMBA_PUBLIC_PORT:-8088}:8088"
    environment:
      SYMBA_DB_URL: "sqlite:////app/backend/data/app.db"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-}"
      # Sign-in token secret (openssl rand -hex 32). Empty = a random one per process
      # (fine for a local try-out; docker-compose.public.yml requires it).
      SYMBA_JWT_SECRET: "${SYMBA_JWT_SECRET:-}"
      SYMBA_ADMIN_EMAIL: "${SYMBA_ADMIN_EMAIL:-}"
      SYMBA_REGISTRATION_OPEN: "${SYMBA_REGISTRATION_OPEN:-true}"
    volumes:
      - symba-data:/app/backend/data
    # The access log carries visitors' IP addresses (uvicorn, to stdout): rotate it so it
    # does not grow without bound. See the privacy notice for the retention note.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  symba-data:
    driver: local
